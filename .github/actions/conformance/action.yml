name: hbt conformance
description: >-
  Hold an hbt executable to this corpus with the conformance harness, without
  Nix. Run it from the implementation's corpus submodule, so the submodule
  stays the one pin on the harness, the corpus and this action.

inputs:
  binary:
    description: The hbt executable to test, relative to the workspace or absolute.
    required: true
  waivers:
    description: A waiver file, relative to the workspace or absolute.
    required: false
    default: ""
  tz:
    description: A timezone to force instead of the runner's own.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The harness's two dependencies, from the runner's Python. Debian and
    # Ubuntu runners only, which is what all four implementations use.
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-click python3-yaml
    # The package is imported from the corpus checkout, which is also where it
    # finds the fixtures, so the step runs from the workspace and paths are
    # the caller's own.
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../..
        BINARY: ${{ inputs.binary }}
        WAIVERS: ${{ inputs.waivers }}
        ZONE: ${{ inputs.tz }}
      run: |
        args=(--binary "$BINARY")
        if [[ -n $WAIVERS ]]; then args+=(--waivers "$WAIVERS"); fi
        if [[ -n $ZONE ]]; then args+=(--tz "$ZONE"); fi
        python3 -m hbt.conformance "${args[@]}"
